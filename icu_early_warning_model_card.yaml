evaluationResults: >
  Subject-grouped split: 94 training patients, 40 test patients, 5,303 test rows,
  target sensitivity 0.80. Logistic model: AUROC 0.7915, AUPRC 0.5911,
  expected calibration error 0.0446, 22.9 false alerts per 100 observations.
  Single-threshold alarm baseline on the same split: AUROC 0.7481, AUPRC 0.5727,
  expected calibration error 0.4158, 31.8 false alerts per 100 observations.
