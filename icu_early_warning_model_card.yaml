headline: A logistic early-warning model for hypotension on the MIMIC-IV open-access
  demo, reported with calibration and alarm burden rather than discrimination alone.
description: >
  Predicts hypotension (mean arterial pressure < 65 mmHg) four hours ahead from
  31 features derived from routine ICU charting. Observations are resampled onto
  a half-hourly grid without looking forward. The card reports calibration error
  and false alerts per 100 observations alongside AUROC, because a well-ranked
  but badly calibrated alarm is the failure mode this project exists to expose.
