modelRisks:
  - The cohort is a demonstration, not a study. About 100 ICU stays is enough to
    show the pipeline is sound and the comparison is fair; it is not enough to
    estimate population performance, and no clinical claim should rest on it.
  - Trained and evaluated on a single open-access demo extract of one US hospital
    system. Transfer to other sites is untested.
evaluationMetrics:
